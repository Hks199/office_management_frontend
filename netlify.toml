[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "24"

# Runs before the API rewrite: supplies a safe missing CSRF Origin and disables caching.
[[edge_functions]]
  function = "api-security"
  path = "/api/*"

# Keep the API prefix. The browser uses this site's /api/v1 URLs and HttpOnly cookies.
[[redirects]]
  from = "/api/*"
  to = "https://sunvika.niakylie.com/api/:splat"
  status = 200
  force = true

# React Router deep links, after the API rule. Existing assets are served normally.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://*.amazonaws.com; connect-src 'self' https://*.amazonaws.com; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self' https://*.amazonaws.com; frame-ancestors 'none'; worker-src 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()"
    Cache-Control = "no-store"
